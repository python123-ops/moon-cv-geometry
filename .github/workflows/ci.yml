name: Check and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup verification Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup JavaScript backend runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup native compiler on Ubuntu
        if: runner.os == 'Linux'
        run: |
          cc --version

      - name: Setup native compiler on macOS
        if: runner.os == 'macOS'
        run: |
          cc --version

      - name: Setup native compiler on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Post install
        run: |
          moon version --all
          moon update

      - name: Enforce supported MoonBit toolchain
        shell: pwsh
        run: |
          $versionLine = & moonc -v | Select-Object -First 1
          if ($versionLine -notmatch 'v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)') {
            throw "Unable to parse Moonc version: $versionLine"
          }
          $version = [version]::new([int]$Matches.major, [int]$Matches.minor, [int]$Matches.patch)
          $minimum = [version]'0.10.14'
          Write-Host "Moonc $versionLine"
          if ($version -lt $minimum) {
            throw "Moonc $version is older than the supported minimum $minimum"
          }

      - name: Strict four-backend tests, numerical examples, interfaces, and package
        run: python scripts/verify.py --report _build/verification.json

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          moon coverage report -f summary
          moon coverage analyze

      - name: Interface gate
        run: |
          git diff --exit-code -- '*.mbti'
